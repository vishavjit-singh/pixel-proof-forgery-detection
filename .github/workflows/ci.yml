name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: End-to-end demo (generate → train → evaluate → charts)
        if: matrix.python-version == '3.12'
        run: make demo
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: evaluation
          path: |
            data/eval/metrics.json
            data/eval/predictions.csv
            docs/images/*.png

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pixelproof .
